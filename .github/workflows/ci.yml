name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholder values so `next build` can prerender. Real values live in
      # Vercel / Convex, never in CI. The publishable key is a syntactically
      # valid dummy (base64 of "clerk.example.com$").
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder-123.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile must be in sync)
        run: npm ci

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Typecheck (Convex functions)
        run: npm run typecheck:convex

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies (fail on critical)
        run: npm audit --omit=dev --audit-level=critical
